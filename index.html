            function initSlideshow() {
                const slideshow = document.getElementById('photoSlideshow');

                const images = slideshow.querySelectorAll('img');
                let currentIndex = 0;
                setInterval(() => {
                    images[currentIndex].classList.remove('active');
                    currentIndex = (currentIndex + 1) % images.length;
                    images[currentIndex].classList.add('active');
                }, 2000);
            }

            function initInteractions() {
                const root = document.documentElement;
                const themeBtn = document.getElementById('themeToggle');
                themeBtn.addEventListener('click', () => {
                    const current = root.getAttribute('data-theme');
                    root.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
                    localStorage.setItem('theme', current === 'dark' ? 'light' : 'dark');
                });

                document.getElementById('printBtn').addEventListener('click', () => window.print());

                function copyText(text, label) {
                    navigator.clipboard?.writeText(text).then(() => alert(`${label}已复制！`)).catch(() => prompt(`复制失败，请手动复制${label}：`, text));
                }

                document.getElementById('copyEmail').addEventListener('click', () => copyText(resume.contact.email, '邮箱'));
                document.getElementById('copyWechat').addEventListener('click', () => copyText(resume.contact.wechat, '微信'));
                document.getElementById('copyQQ').addEventListener('click', () => copyText(resume.contact.qq, 'QQ'));

                document.getElementById('copyGameLink')?.addEventListener('click', (e) => {
                    const url = e.currentTarget.dataset.url;
                    copyText(url, '游戏链接');
                });

                const backTop = document.getElementById('backTop');
                window.addEventListener('scroll', () => {
                    if (window.scrollY > 500) backTop.classList.add('visible');
                    else backTop.classList.remove('visible');
                });
                backTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

                setupTabs('expTabs');
                setupTabs('projTabs');

                document.getElementById('playGameBtn')?.addEventListener('click', () => {
                    document.querySelector('#projects')?.scrollIntoView({ behavior: 'smooth' });
                    setTimeout(() => {
                        const tabs = document.querySelectorAll('#projTabs .tab-btn');
                        if (tabs.length > 0) {
                            tabs[0].click();
                        }
                    }, 300);
                });

                document.getElementById('startGameBtn')?.addEventListener('click', () => {
                    document.getElementById('gameContainer')?.scrollIntoView({ behavior: 'smooth' });
                });

                document.querySelectorAll('[data-nav]').forEach(a => {
                    a.addEventListener('click', (e) => {
                        e.preventDefault();
                        const id = a.getAttribute('href');
                        document.querySelector(id)?.scrollIntoView({ behavior: 'smooth' });
                    });
                });
            }

            function setupTabs(containerId) {
                const container = document.getElementById(containerId);
                if (!container) return;
                const tabs = container.querySelectorAll('.tab-btn');
                const panels = container.querySelectorAll('.tab-panel');

                function activateTab(index) {
                    tabs.forEach((tab, i) => {
                        const selected = i === index;
                        tab.setAttribute('aria-selected', selected);
                        tab.tabIndex = selected ? 0 : -1;
                        panels[i].hidden = !selected;
                    });
                }

                tabs.forEach((tab, index) => {
                    tab.addEventListener('click', () => activateTab(index));
                    tab.addEventListener('keydown', (e) => {
                        if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
                            e.preventDefault();
                            const total = tabs.length;
                            let newIndex = index;
                            if (e.key === 'ArrowRight') newIndex = (index + 1) % total;
                            if (e.key === 'ArrowLeft') newIndex = (index - 1 + total) % total;
                            activateTab(newIndex);
                            tabs[newIndex].focus();
                        }
                    });
                });
            }

            // BGM 控制
            const bgm = document.getElementById('bgm');
            const bgmToggle = document.getElementById('bgmToggle');
            let isPlaying = false;

            // 尝试自动播放
            bgm.volume = 0.5;
            bgm.play().then(() => {
                isPlaying = true;
                bgmToggle.textContent = '🔊';
                bgmToggle.classList.add('playing');
            }).catch(() => {
                isPlaying = false;
                bgmToggle.textContent = '🔇';
                bgmToggle.classList.remove('playing');
            });

            // 如果自动播放被阻止，等待首次点击页面任意位置再播放
            document.addEventListener('click', function tryPlay() {
                if (!isPlaying) {
                    bgm.play().then(() => {
                        isPlaying = true;
                        bgmToggle.textContent = '🔊';
                        bgmToggle.classList.add('playing');
                    }).catch(() => {
                        bgmToggle.textContent = '🔇';
                        bgmToggle.classList.remove('playing');
                    });
                }
                document.removeEventListener('click', tryPlay);
            });

            // 喇叭按钮控制
            bgmToggle.addEventListener('click', (e) => {
                e.stopPropagation();
                if (isPlaying) {
                    bgm.pause();
                    isPlaying = false;
                    bgmToggle.textContent = '🔇';
                    bgmToggle.classList.remove('playing');
                } else {
                    bgm.play().then(() => {
                        isPlaying = true;
                        bgmToggle.textContent = '🔊';
                        bgmToggle.classList.add('playing');
                    }).catch(() => {
                        bgmToggle.textContent = '🔇';
                        bgmToggle.classList.remove('playing');
                    });
                }
            });

            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);

            renderAll();

            const now = new Date();
            footer.innerHTML = `© 2026 陈东弟 · 信息安全技术应用 · 最后更新 ${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}`;
        })();
    </script>
</body>
</html>
